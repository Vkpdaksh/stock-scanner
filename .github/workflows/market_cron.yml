name: Market Background Scanner

on:
  schedule:
    # 3:00 UTC to 17:30 UTC = Subah 8:30 AM IST se Raat 11:00 PM IST (Mon-Fri)
    - cron: '*/30 3-17 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas ta yfinance lxml requests html5lib

      - name: Run Market Scanner
        run: |
          python scanner_bot.py

      - name: Commit & Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json active_trades.json daily_stats.json || true
          git commit -m "Auto-update trade tracking and daily stats" || true
          git push || true
