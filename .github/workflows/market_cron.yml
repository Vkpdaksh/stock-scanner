name: Market Background Scanner

on:
  schedule:
    # Runs every 15 minutes between 03:00 UTC and 17:30 UTC (08:30 AM to 11:00 PM IST, Mon-Fri)
    - cron: '*/15 3-17 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Required Libraries
        run: |
          pip install --upgrade pip
          pip install smartapi-python pyotp pandas ta yfinance

      - name: Run Market Scanner Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
        run: |
          python scanner_bot.py

      - name: Commit & Push State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json active_trades.json daily_stats.json || true
          git commit -m "Update active trades and alert state [skip ci]" || true
          git push || true
